[project]
name = "pre-twinx"
version = "0.1.0"
description = "A single tool to manage multiple things"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["rich>=13.0"]

[project.scripts]
pre = "pre.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pre*"]
